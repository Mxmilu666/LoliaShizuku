name: Release Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

env:
  CGO_ENABLED: 1
  WAILS_SKIP_UPDATE_CHECK: 1
  WAILS_VERSION: v3.0.0-beta.28

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            artifact_os: linux
            artifact_arch: x64
            nfpm_arch: amd64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            artifact_os: linux
            artifact_arch: arm64
            nfpm_arch: arm64
          - name: windows-x64
            os: windows-latest
            artifact_os: windows
            artifact_arch: x64
          - name: windows-arm64
            os: windows-11-arm
            artifact_os: windows
            artifact_arch: arm64
          - name: macos-x64
            os: macos-15-intel
            artifact_os: macos
            artifact_arch: x64
          - name: macos-arm64
            os: macos-15
            artifact_os: macos
            artifact_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        if: matrix.name != 'windows-arm64'
        uses: oven-sh/setup-bun@v2

      # Bun 在 windows-arm64 runner 上不可用，改用 npm 构建前端
      - name: Setup Node (windows-arm64)
        if: matrix.name == 'windows-arm64'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libappindicator3-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Install Wails CLI
        shell: bash
        # CLI 本身无需 cgo；开启时在 Linux 上会依赖 GTK4 / WebKitGTK 6.0 开发包
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify NSIS (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          which makensis || true
          makensis -VERSION || true

      - name: Install nfpm (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # 固定版本：v2.47+ 需要 Go 1.26.4，高于 go.mod 的 Go 版本
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build app
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short=12 HEAD)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${TAG}" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="dev-${COMMIT}"
          fi

          LDFLAGS="-X github.com/Mxmilu666/LoliaShizuku/backend/version.Version=${VERSION} -X github.com/Mxmilu666/LoliaShizuku/backend/version.GitCommit=${COMMIT} -X github.com/Mxmilu666/LoliaShizuku/backend/version.GitBranch=${TAG} -X github.com/Mxmilu666/LoliaShizuku/backend/version.BuildTime=${BUILD_TIME}"

          PACKAGE_MANAGER="bun"
          if [[ "${{ matrix.name }}" == "windows-arm64" ]]; then
            PACKAGE_MANAGER="npm"
          fi

          if [[ "${{ matrix.artifact_os }}" == "linux" ]]; then
            # 使用 GTK3 + WebKitGTK 4.1（Wails v3 默认是 GTK4 + WebKitGTK 6.0）
            wails3 build PACKAGE_MANAGER="$PACKAGE_MANAGER" EXTRA_TAGS=gtk3 EXTRA_LDFLAGS="$LDFLAGS"
          else
            # Windows: bin/LoliaShizuku.exe + NSIS 安装包；macOS: bin/LoliaShizuku.app
            wails3 package PACKAGE_MANAGER="$PACKAGE_MANAGER" EXTRA_LDFLAGS="$LDFLAGS"
          fi

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          REF_SAFE="$(echo "${GITHUB_REF_NAME}" | sed 's#[^A-Za-z0-9._-]#-#g')"
          REF_PART="-${REF_SAFE}"
          if [[ "${REF_SAFE}" == "main" ]]; then
            REF_PART=""
          fi
          ARTIFACT_ARCH="${{ matrix.artifact_arch }}"
          NFPM_ARCH="${{ matrix.nfpm_arch }}"

          if [[ "${{ matrix.artifact_os }}" == "linux" ]]; then
            BIN_PATH="$(find bin -maxdepth 1 -type f -name 'LoliaShizuku' | head -n 1 || true)"
            if [[ -z "${BIN_PATH}" ]]; then
              echo "linux binary not found in bin"
              exit 1
            fi
            ICON_SRC="build/appicon.png"
            if [[ ! -f "${ICON_SRC}" ]]; then
              echo "nfpm icon not found at ${ICON_SRC}"
              exit 1
            fi
            DESKTOP_SRC="build/linux/loliashizuku.desktop"
            if [[ ! -f "${DESKTOP_SRC}" ]]; then
              echo "desktop file not found at ${DESKTOP_SRC}"
              exit 1
            fi

            cp "${BIN_PATH}" "dist/LoliaShizuku${REF_PART}-linux-${ARTIFACT_ARCH}"
            chmod +x "dist/LoliaShizuku${REF_PART}-linux-${ARTIFACT_ARCH}"

            TAG="${GITHUB_REF_NAME}"
            COMMIT="$(git rev-parse --short=12 HEAD)"
            if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${TAG}" == v* ]]; then
              PKG_VERSION="${TAG#v}"
              PKG_RELEASE="1"
            else
              PKG_VERSION="0.0.0"
              PKG_RELEASE="dev.${COMMIT}"
            fi

            ARCHIVE="LoliaShizuku${REF_PART}-linux-${ARTIFACT_ARCH}.tar.gz"
            tar -czf "dist/${ARCHIVE}" -C bin .

            sed \
              -e "s|__NFPM_ARCH__|${NFPM_ARCH}|g" \
              -e "s|__PKG_VERSION__|${PKG_VERSION}|g" \
              -e "s|__PKG_RELEASE__|${PKG_RELEASE}|g" \
              -e "s|__HOMEPAGE__|https://github.com/${GITHUB_REPOSITORY}|g" \
              -e "s|__BIN_PATH__|${BIN_PATH}|g" \
              -e "s|__DESKTOP_PATH__|${DESKTOP_SRC}|g" \
              -e "s|__ICON_PATH__|${ICON_SRC}|g" \
              build/nfpm.yaml.tmpl > dist/nfpm.yaml

            nfpm package -f dist/nfpm.yaml -p deb -t "dist/LoliaShizuku${REF_PART}-linux-${NFPM_ARCH}.deb"
            nfpm package -f dist/nfpm.yaml -p rpm -t "dist/LoliaShizuku${REF_PART}-linux-${NFPM_ARCH}.rpm"
            nfpm package -f dist/nfpm.yaml -p archlinux -t "dist/LoliaShizuku${REF_PART}-linux-${NFPM_ARCH}.pkg.tar.zst"

            exit 0
          fi

          if [[ "${{ matrix.artifact_os }}" == "windows" ]]; then
            PORTABLE_EXE="$(find bin -maxdepth 1 -type f -iname 'LoliaShizuku.exe' | head -n 1 || true)"
            INSTALLER_EXE="$(find bin -maxdepth 1 -type f -iname 'LoliaShizuku-*-installer.exe' | head -n 1 || true)"
            if [[ -z "${PORTABLE_EXE}" ]]; then
              echo "portable exe not found in bin"
              exit 1
            fi
            if [[ -z "${INSTALLER_EXE}" ]]; then
              echo "nsis installer exe not found in bin/"
              echo "available exe files under bin/:"
              find bin -type f -iname '*.exe' -print || true
              exit 1
            fi
            cp "${PORTABLE_EXE}" "dist/LoliaShizuku${REF_PART}-windows-${ARTIFACT_ARCH}.exe"
            cp "${INSTALLER_EXE}" "dist/LoliaShizuku${REF_PART}-windows-${ARTIFACT_ARCH}-installer.exe"
            exit 0
          fi

          if [[ "${{ matrix.artifact_os }}" == "macos" ]]; then
            APP_PATH="$(find bin -maxdepth 1 -name 'LoliaShizuku.app' | head -n 1 || true)"
            if [[ -z "${APP_PATH}" ]]; then
              echo "macOS .app not found in bin"
              exit 1
            fi
            DMG_PATH="dist/LoliaShizuku${REF_PART}-macos-${ARTIFACT_ARCH}.dmg"
            DMG_STAGING_DIR="$(mktemp -d)"
            cp -R "${APP_PATH}" "${DMG_STAGING_DIR}/"
            ln -s /Applications "${DMG_STAGING_DIR}/Applications"
            hdiutil create \
              -volname "LoliaShizuku" \
              -srcfolder "${DMG_STAGING_DIR}" \
              -ov \
              -format UDZO \
              "${DMG_PATH}"
            rm -rf "${DMG_STAGING_DIR}"

            APP_BIN="$(find "${APP_PATH}/Contents/MacOS" -maxdepth 1 -type f | head -n 1 || true)"
            if [[ -z "${APP_BIN}" ]]; then
              echo "macOS app executable not found in ${APP_PATH}/Contents/MacOS"
              exit 1
            fi
            cp "${APP_BIN}" "dist/LoliaShizuku${REF_PART}-macos-${ARTIFACT_ARCH}"
            chmod +x "dist/LoliaShizuku${REF_PART}-macos-${ARTIFACT_ARCH}"
            exit 0
          fi

          echo "unknown matrix.artifact_os: ${{ matrix.artifact_os }}"
          exit 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*
            !dist/nfpm.yaml
          if-no-files-found: error

  build-android:
    name: Build android-arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Gradle 9.2 只能运行在 JDK 17–25 上
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Wails CLI
        shell: bash
        # CLI 本身无需 cgo；开启时在 Linux 上会依赖 GTK4 / WebKitGTK 6.0 开发包
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # GitHub 托管的 ubuntu runner 已预装 Android SDK 与 NDK（ANDROID_HOME / ANDROID_NDK_HOME），
      # 缺少的 SDK Platform / Build-Tools 由 Gradle 在构建时自动下载
      - name: Show Android toolchain
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<unset>}"
          ls "${ANDROID_HOME}/ndk" || true

      # 配置了签名密钥时使用正式签名；否则使用 debug 证书（每台 runner 的 debug 证书不同，无法覆盖安装）
      - name: Prepare signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK will be signed with a debug certificate"
          fi

      - name: Build APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short=12 HEAD)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${TAG}" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="dev-${COMMIT}"
          fi

          LDFLAGS="-X github.com/Mxmilu666/LoliaShizuku/backend/version.Version=${VERSION} -X github.com/Mxmilu666/LoliaShizuku/backend/version.GitCommit=${COMMIT} -X github.com/Mxmilu666/LoliaShizuku/backend/version.GitBranch=${TAG} -X github.com/Mxmilu666/LoliaShizuku/backend/version.BuildTime=${BUILD_TIME}"

          export APP_VERSION_NAME="${VERSION}"
          export APP_VERSION_CODE="${GITHUB_RUN_NUMBER}"
          wails3 task android:package ARCH=arm64 PACKAGE_MANAGER=bun EXTRA_LDFLAGS="$LDFLAGS"

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          REF_SAFE="$(echo "${GITHUB_REF_NAME}" | sed 's#[^A-Za-z0-9._-]#-#g')"
          REF_PART="-${REF_SAFE}"
          if [[ "${REF_SAFE}" == "main" ]]; then
            REF_PART=""
          fi
          if [[ ! -f bin/LoliaShizuku.apk ]]; then
            echo "APK not found in bin/"
            exit 1
          fi
          cp bin/LoliaShizuku.apk "dist/LoliaShizuku${REF_PART}-android-arm64.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-android-arm64
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: artifacts/**/*
