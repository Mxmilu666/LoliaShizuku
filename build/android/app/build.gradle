plugins {
    id 'com.android.application'
}

android {
    // Java 包名需保持 com.wails.app：Wails 的 JNI 导出符号（Java_com_wails_app_*）写死了该包名。
    // 应用的实际包名由下方 applicationId 决定。
    namespace 'com.wails.app'
    compileSdk 35

    lint {
        // targetSdk 28 是有意为之（见下方 defaultConfig），避免 release 构建被 lintVitalRelease 拦截
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
        // AGP 8.7 的 lint 无法识别 JDK 25+ 的版本号，release 构建时跳过 lintVital
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.mxmilu666.loliashizuku"
        minSdk 21
        // 与 Termux 相同：targetSdk 28 才允许执行应用私有目录中下载的 frpc 二进制（API 29+ 禁止）。
        // 代价是无法上架 Google Play，仅通过 APK 分发。
        targetSdk 28
        // CI 通过环境变量注入：versionName 取自 tag，versionCode 取自运行序号（需单调递增才能覆盖安装）
        versionCode((System.getenv("APP_VERSION_CODE") ?: "1").toInteger())
        versionName(System.getenv("APP_VERSION_NAME") ?: "0.0.0-dev")

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
